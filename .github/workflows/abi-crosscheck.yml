name: ABI cross-check

# Online + keyed by design (ADR 0007): runs every package's `test:abi:online`
# suite (root script: `pnpm -r --if-present test:abi:online`). A protocol
# package opts in by shipping that script; today that is kuru, which verifies
# its vendored Router ABI against the explorer-verified implementation and
# asserts the pinned proxy targets have not been upgraded. Fork PRs never
# receive the secret — this workflow has no pull_request trigger at all;
# offline `pnpm test` remains the only gate they need.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same policy as CI. This workflow has no pull_request trigger, so it
      # always runs the base branch's definition and a contributor cannot edit
      # this step away — which is why it, not CI, is the one that actually
      # guards a credential.
      - name: Restrict runner egress
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            registry.npmjs.org:443
            api.etherscan.io:443
            rpc.monad.xyz:443
            moss-rpc.0xmon.dev:443

      # Exchanges the mint token for a short-lived, read-only RPC URL. Runs before
      # any checkout so the token stays out of later steps.
      #
      # Fork pull requests receive no secrets, so this is empty there and the suites
      # fall back to the public endpoint in the allowlist above.
      - name: Mint a short-lived RPC URL
        env:
          MOSS_RPC_MINT_TOKEN: ${{ secrets.MOSS_RPC_MINT_TOKEN }}
        run: |
          if [ -z "$MOSS_RPC_MINT_TOKEN" ]; then
            echo "No mint token available; the live suites will use the public endpoint."
            exit 0
          fi
          url=$(curl -sSf -m 30 -X POST https://moss-rpc.0xmon.dev/mint \
                  -H "authorization: Bearer $MOSS_RPC_MINT_TOKEN")
          echo "::add-mask::$url"
          echo "MOSS_RPC_URL=$url" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A missing MONADSCAN_API_KEY fails the suite instead of skipping, so a
      # misconfigured secret cannot produce a green run.
      - name: Explorer cross-check
        env:
          MONADSCAN_API_KEY: ${{ secrets.MONADSCAN_API_KEY }}
        run: pnpm test:abi:online
