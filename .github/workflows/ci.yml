name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fork pull requests execute contributor-authored test code on this runner.
# Nothing here needs write access, so the token is read-only.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Egress is restricted rather than audited, because this job receives a
      # private RPC endpoint and audit mode cannot disable telemetry — only
      # block mode can, and reporting that endpoint to a third party would
      # defeat keeping it secret.
      #
      # Two secrets hold the same endpoint in two spellings, because log masking
      # is exact-string: MOSS_RPC_ENDPOINT is the full URL the tests connect to,
      # MOSS_RPC_URL is the `host:443` form this allowlist needs. Deriving one
      # from the other in a run step would produce an unmasked copy.
      #
      # Fork pull requests receive no secrets, so both lines are empty there and
      # the tests fall back to the public endpoint in the list below.
      #
      # Linux-only (eBPF), so the windows-offline job below cannot use it.
      - name: Restrict runner egress
        uses: step-security/harden-runner@v2
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            nodejs.org:443
            registry.npmjs.org:443
            api.kuru.io:443
            rpc.monad.xyz:443
            ${{ secrets.MOSS_RPC_URL }}

      - uses: actions/checkout@v4

      # Foundry-in-monorepo invariant (ADR 0007): no git submodules, ever.
      # forge init/install must use --no-git; this catches any violation.
      - name: Forbid git submodules
        run: |
          if [ -e .gitmodules ] || git ls-files -s | grep -q '^160000'; then
            echo "git submodules are banned in this repo (ADR 0007): use forge --no-git, npm+remappings, or soldeer"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build precedes typecheck: workspace packages resolve each other's
      # types through their built dist/*.d.ts.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # The live suites reach the chain through core's DEFAULT_RPC_URL, which reads
      # MOSS_RPC_URL. The secret is named MOSS_RPC_ENDPOINT; the variable keeps the
      # name the MCP CLI and the examples already use. Fork pull requests receive no
      # secrets, so this arrives blank there and core falls back to the public
      # endpoint — use the `Live verification` workflow to re-run one of those
      # against the private endpoint.
      - name: Test
        run: pnpm test
        env:
          MOSS_RPC_URL: ${{ secrets.MOSS_RPC_ENDPOINT }}

  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Offline test
        run: pnpm test:offline
